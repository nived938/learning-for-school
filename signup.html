<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Free Account | Apex Digital</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
</head>
<body>

    <!-- SITE HEADER -->
    <header class="site-header">
        <div class="container navbar">
            <a href="index.html" class="brand-logo">
                <img src="images/logo.png" alt="Apex Logo" class="logo-img">
                <span class="brand-name">Apex<span>Digital</span></span>
            </a>

            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
                <li><a href="gallery.html" class="nav-link">Gallery</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
            </ul>

            <div class="nav-actions">
                <a href="login.html" class="btn btn-secondary btn-sm">Log In</a>
                <a href="signup.html" class="btn btn-primary btn-sm">Get Started</a>
            </div>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="badge">
                    <span class="badge-dot"></span>
                    Get Started Free
                </div>
                <h2>Create Account</h2>
                <p>Join the next generation of web developers and creators</p>
            </div>

            <form action="#" onsubmit="return false;">
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" class="form-control" placeholder="Alex Morgan" required>
                </div>

                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" class="form-control" placeholder="alex@domain.com" required>
                </div>

                <div class="form-group">
                    <label for="signup-password">Choose Password</label>
                    <input type="password" id="signup-password" class="form-control" placeholder="Minimum 8 characters" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                    Create Free Account
                    <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>

            <div class="auth-footer-text">
                Already registered? <a href="login.html">Sign in here</a>
            </div>
        </div>
    </main>

    <!-- SITE FOOTER -->
    <footer class="site-footer" style="margin-top: 0;">
        <div class="container">
            <div class="footer-bottom" style="border-top: none; padding-top: 0;">
                <p>&copy; 2026 Apex Digital Technologies. All rights reserved.</p>
                <p>Crafted with Pure HTML5 &amp; Modern CSS3</p>
            </div>
        </div>
    </footer>

</body>
</html>
